# LiteMC - server-specific commands for the PlayMC server.
#
# Message strings use MiniMessage tags (<gray>, <green>, <bold>), the same
# syntax as the SimpleChat formats. %placeholders% are substituted before the
# tags are parsed.
#
# This file is copied to the node by playmc-litemc-config/plugins.yml, so edit
# it there once the plugin is deployed - the copy on the server is overwritten
# on every run.

rules:
  # Printed in order by /rules. Add, remove or reorder lines freely; no
  # rebuild is needed, only a server restart to reload the config.
  lines:
    - "<white><bold>Gizotopia</bold></white> <dark_gray>-</dark_gray> <gray>server rules</gray>"
    - "<dark_gray> 1 </dark_gray><gray>PvP is on, but it is not what this server is about. Fight when both sides want to; no hunting people down, no spawn camping.</gray>"
    - "<dark_gray> 2 </dark_gray><gray>Griefing is forbidden. Do not break, burn or take anything that is not yours.</gray>"
    - "<dark_gray> 3 </dark_gray><gray>You join as <white>Visitor</white>. Ask a friend who already has the <green>Player</green> role to run <green>/grant yourname</green> to promote you.</gray>"

welcome:
  # Sent on join to players who are still Visitors. Anyone already in the
  # grant.group below never sees it, so it stops on its own once a newcomer
  # has been granted - nothing is stored per player.
  enabled: true

  # Ticks to wait after joining, so the greeting lands after the join and
  # MOTD noise instead of being scrolled away by it. 20 ticks is one second.
  delay-ticks: 40

  lines:
    - "<gray>Welcome to <white><bold>Gizotopia</bold></white>, %player%.</gray>"
    - "<gray>You are a <white>Visitor</white> for now: look around, but you cannot build yet.</gray>"
    - "<gray>Read <green>/rules</green> first, then ask a player who has the <green>Player</green> role to run <green>/grant %player%</green> for you.</gray>"
  
  granted:
    - "<gray>Welcome back, <green>%player%</green>.</gray>"

grant:
  # LuckPerms group a successful /grant puts the target in. Must match a group
  # in playmc-litemc-config/plugins/LuckPerms/yaml-storage/groups/.
  group: player

  # Dispatched from the console, never as the sender, so whoever runs /grant
  # needs litemc.grant and none of LuckPerms' own nodes.
  # %uuid%, %player% and %group% are substituted.
  command: "lp user %uuid% parent set %group%"

  # LuckPerms applies the change asynchronously, so membership is re-checked
  # this many ticks later and a warning is logged if it did not land.
  # 0 disables the check. 20 ticks is one second.
  verify-delay-ticks: 40

  usage: "<gray>Usage: <white>/%label% playername</white> <dark_gray>-</dark_gray> <gray>promote an online visitor to Player.</gray>"
  not-online: "<gray>%player% is not online. They have to be connected to be granted.</gray>"
  already-granted: "<gray>%player% already has the <green>%group%</green> role.</gray>"
  not-yourself: "<gray>You cannot grant yourself. Ask someone who is already a Player.</gray>"
  granted: "<gray>%player% is now <green>%group%</green>.</gray>"
  promoted: "<gray>%sender% granted you the <green>%group%</green> role. Welcome in.</gray>"
  failed: "<gray>Could not grant %player%. An operator needs to check the server log.</gray>"
